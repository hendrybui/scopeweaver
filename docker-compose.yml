# Portable stack: postgres, the app, and an opt-in ollama profile.
#
# Anything that depends on THIS machine's layout — the Pandora tool tree, host
# binaries/libraries, the separate storm checkout — lives in
# docker-compose.override.yml, which Compose merges automatically when it sits
# next to this file. On a machine without those paths, edit that file or delete
# it and run the base alone.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Authenticates over TCP with the SAME variables the app's DSN is built
      # from, against the container's own (non-loopback) address so the
      # scram-sha-256 rule applies — the image trusts 127.0.0.1, so a loopback
      # check cannot see a drifted password. `pg_isready` alone only proves the
      # postmaster is up, so a user/password that no longer matches the role in
      # the volume still reported healthy while every app connection failed.
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h \"$$(hostname -i | awk '{print $$1}')\" -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'select 1' >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped
  scopeweaver:
    build:
      context: .
    image: scopeweaver:local
    depends_on:
      postgres:
        condition: service_healthy
    # ldconfig publishes the host library tree into the loader cache at start when
    # it is mounted (a bind mount cannot be cached at build time), then hands off to
    # the image entrypoint unchanged. Harmless without it.
    entrypoint: ["/bin/sh", "-c", "ldconfig 2>/dev/null || true; exec /app/start.sh \"$@\"", "sh"]
    # Explicit, because the entrypoint wrapper takes the image CMD as arguments.
    command: ["-addr", ":8787", "-proxy", ":8788"]
    environment:
      SCOPEWEAVER_LANGUAGE: ${SCOPEWEAVER_LANGUAGE:-en}
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
      SCOPEWEAVER_LLM_PROVIDER: ${SCOPEWEAVER_LLM_PROVIDER:-${ARTEX_LLM_PROVIDER:-}}
      SCOPEWEAVER_LLM_MODEL: ${SCOPEWEAVER_LLM_MODEL:-${ARTEX_LLM_MODEL:-}}
      SCOPEWEAVER_LLM_BASE_URL: ${SCOPEWEAVER_LLM_BASE_URL:-${ARTEX_LLM_BASE_URL:-}}
      SCOPEWEAVER_LLM_PROXY: ${SCOPEWEAVER_LLM_PROXY:-${ARTEX_LLM_PROXY:-}}
      # Unset generic keys stay absent so provider-specific BYOK credentials work.
      SCOPEWEAVER_LLM_API_KEY:
      ARTEX_LLM_API_KEY:
      SCOPEWEAVER_LLM_CONTEXT_WINDOW_K: ${SCOPEWEAVER_LLM_CONTEXT_WINDOW_K:-${ARTEX_LLM_CONTEXT_WINDOW_K:-}}
      SCOPEWEAVER_LLM_KEEP_ALIVE: ${SCOPEWEAVER_LLM_KEEP_ALIVE:-${ARTEX_LLM_KEEP_ALIVE:-}}
      SCOPEWEAVER_LLM_MAX_CONCURRENT: ${SCOPEWEAVER_LLM_MAX_CONCURRENT:-${ARTEX_LLM_MAX_CONCURRENT:-}}
      SCOPEWEAVER_LOCAL_LLM_ONLY: ${SCOPEWEAVER_LOCAL_LLM_ONLY:-${ARTEX_LOCAL_LLM_ONLY:-false}}
      SCOPEWEAVER_LOCAL_LLM_ALLOWED_CIDRS: ${SCOPEWEAVER_LOCAL_LLM_ALLOWED_CIDRS:-${ARTEX_LOCAL_LLM_ALLOWED_CIDRS:-}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Loopback only.  This container mounts the host docker socket, so it is
      # root-equivalent over the host; a 0.0.0.0 publish would put that on the
      # LAN.  Reach it over SSH/tailnet, not a bound port.
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      # Session key, pinned outside the image: without this every recreate
      # regenerates /app/jwt.key and logs every browser out. The SOURCE FILE must
      # exist, otherwise Docker creates a directory at the target and the fatal
      # "write jwt key" path fires — `touch jwt.key` if it is missing. An empty
      # file is fine: the server writes a real 32-byte key into it on first start.
      - ./jwt.key:/app/jwt.key
      # The host daemon, so `docker`/`docker compose` here act on host stacks.
      # Note the socket is root-equivalent: the container can drive every host
      # container, and any path it passes must exist on the HOST, not here.
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "32768"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  pgdata:
  ollama_data:
